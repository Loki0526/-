const NPC_STEP=8,NPC_GAP=20;
function npcWait(n,initial=false){n.route=[];n.wait=initial?Math.random()*4:3+Math.random()*7;n.stuck=0;n.motion='idle'}
function npcRoute(n,goal){
 const step=NPC_STEP, minX=232,maxX=712,minY=n.id<5?248:332,maxY=n.id<5?304:552;
 const valid=(x,y)=>x>=minX&&x<=maxX&&y>=minY&&y<=maxY&&!blocked(x,y);
 const key=(x,y)=>x+','+y;
 const sx=Math.round(n.x/step)*step,sy=Math.round(n.y/step)*step;
 const gx=Math.round(goal.x/step)*step,gy=Math.round(goal.y/step)*step;
 if(!valid(gx,gy))return [];
 const queue=[[sx,sy]],prev=new Map([[key(sx,sy),null]]);
 for(let i=0;i<queue.length&&i<4000;i++){
  const [x,y]=queue[i],k=key(x,y);
  if(x===gx&&y===gy){const out=[];let cur=k;while(prev.get(cur)!==null){const [a,b]=cur.split(',').map(Number);out.push({x:a,y:b});cur=prev.get(cur)}return out.reverse()}
  for(const [dx,dy] of [[step,0],[-step,0],[0,step],[0,-step]]){const a=x+dx,b=y+dy,j=key(a,b);if(!prev.has(j)&&valid(a,b)){prev.set(j,k);queue.push([a,b])}}
 }
 return [];
}
function chooseNpcRoute(n){
 const home=npcHomes[n.id];
 for(let attempt=0;attempt<16;attempt++){
  const goal={x:home.x+(Math.random()-.5)*(n.id<5?180:240),y:home.y+(n.id<5?Math.random()*48:(Math.random()-.25)*150)};
  if(Math.hypot(goal.x-n.x,goal.y-n.y)<28)continue;
  const route=npcRoute(n,goal);if(route.length){n.route=route;n.stuck=0;return}
 }
 npcWait(n);
}
function npcClear(n,x,y){
 if(blocked(x,y))return false;
 for(const p of [...players,...npcs]){
  if(p===n)continue;
  const d=Math.hypot(x-p.x,y-p.y),old=Math.hypot(n.x-p.x,n.y-p.y);
  if(d<NPC_GAP&&d<old-.001)return false;
 }

}
function updateLobbyNpcs(dt){
 if(scene)return;
 for(const n of npcs){
  n.motion='idle';
  if(n.chat||n.reply)continue;if(!n.route)npcWait(n,true);
  if(n.wait>0){n.wait-=dt;continue}
  if(!n.route.length){chooseNpcRoute(n);continue}
  const goal=n.route[0],dx=goal.x-n.x,dy=goal.y-n.y,d=Math.hypot(dx,dy);
  if(d<1){n.route.shift();if(!n.route.length)npcWait(n);continue}
  const step=Math.min(d,dt*(36+n.id%3*5)),a=dx/d*step,b=dy/d*step;
  const ox=n.x,oy=n.y;
  if(npcClear(n,n.x+a,n.y))n.x+=a;
  if(npcClear(n,n.x,n.y+b))n.y+=b;
  const mx=n.x-ox,my=n.y-oy;
  if(Math.hypot(mx,my)>.001){n.motion='walk';n.dir=Math.abs(mx)>Math.abs(my)?(mx>0?'right':'left'):(my>0?'front':'back');n.stuck=0}
  else if((n.stuck=(n.stuck||0)+dt)>1.2)npcWait(n);
 }
}

function followParty(dt){if(!scene)return;const leader=players[active];const followers=[players[1-active],...team.map(id=>npcs[id])];let previous=leader;for(const p of followers){const dx=previous.x-p.x,dy=previous.y-p.y,d=Math.hypot(dx,dy);if(d>27){const step=Math.min(d-27,dt*(running?220:155));move(p,dx/d*step,dy/d*step)}previous=p;}}function loop(t){let dt=Math.min((t-last)/1000,.04)||0;last=t;players.forEach(p=>p.motion='idle');if(!dlg.open){let dx=0,dy=0,p=players[active];if(keys.has('ArrowLeft')||keys.has('a'))dx--;if(keys.has('ArrowRight')||keys.has('d'))dx++;if(keys.has('ArrowUp')||keys.has('w'))dy--;if(keys.has('ArrowDown')||keys.has('s'))dy++;if(dx||dy)target=null;if(target){let d=Math.hypot(target.x-p.x,target.y-p.y);if(d<5)target=null;else{dx=(target.x-p.x)/d;dy=(target.y-p.y)/d}}if(dx||dy){let d=Math.hypot(dx,dy),speed=energy[active]>0?(running?220:145):70;move(p,dx/d*speed*dt,dy/d*speed*dt,running&&energy[active]>0);energy[active]=Math.max(0,energy[active]-dt*.65)}updateReplies(dt);updateAmbient(dt);updateLobbyNpcs(dt);followParty(dt);players.forEach((p,i)=>{if(inRest(p))energy[i]=100})}draw();requestAnimationFrame(loop)}let dialogClosedAt=-Infinity;
function closeConversation(){dialogClosedAt=performance.now();keys.clear();target=null;running=false;try{if(dlg.open)dlg.close()}finally{dlg.removeAttribute('open');dlg.hidden=true;content.replaceChildren();if(document.activeElement instanceof HTMLElement)document.activeElement.blur();}}
function modal(title,body,buttons=[]){dlg.hidden=false;keys.clear();target=null;running=false;content.replaceChildren();let h=document.createElement('h2');h.textContent=title;let p=document.createElement('p');p.textContent=body;content.append(h,p);buttons.forEach(([s,f])=>{let b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=e=>{e.preventDefault();e.stopPropagation();f()};content.append(b)});if(!dlg.open)dlg.showModal()}function shop(){modal('零食商店','餘額 $'+money+'。購買零食後可隨時補充體力。',[['買餅乾 $20',()=>{if(money>=20){money-=20;food++;shop()}else modal('零食商店','金額不足。')}],['吃零食',()=>{if(food){food--;energy[active]=Math.min(100,energy[active]+30)}shop()}]])}const wardrobeItems={
 '貝拉':[{id:'default',label:'預設服裝'}],
 '阿龍':[{id:'work',label:'工作服＋胸包'},{id:'casual',label:'日常服'}]
};
function openWardrobe(){
 const p=players[active],items=wardrobeItems[p.name]||[];
 const current=items.find(i=>i.id===p.outfit);
 modal(p.name+'的衣帽間','目前穿著：'+(current?.label||'預設服裝'),items.map(item=>[item.label+(item.id===p.outfit?'（穿著中）':''),()=>{p.outfit=item.id;p.animState=null;closeConversation()}]));
}
function interact(){if(dlg.open||performance.now()-dialogClosedAt<350)return;if(scene){modal('返回基地','結束測試並回到重生區？',[['返回',()=>{scene=0;spawn();dlg.close()}]]);return}let s=near();if(!s){modal('背包','目前持有零食 '+food+' 份。',[['吃零食',()=>{if(food){food--;energy[active]=Math.min(100,energy[active]+30)}dlg.close()}]]);return}switch(s.type){case 'shop':shop();break;case 'rest':modal('休息點','走進右側休息區，所在區域內的角色會自動恢復至 100% 體力，不需要按互動。');break;case 'npc':{const n=npcs[s.id];stopAmbient(n);n.reply=null;faceNpc(n,players[active]);npcWait(n);talkNpc(s.id);break;}case 'equipment':modal('劇組器材車','器材車留在中央空地，請到左側停車場出發。');break;case 'props':modal('道具間','道具領取與歸還功能待開發。');break;case 'ward':openWardrobe();break;case 'ride':if(team.length!==2){modal('尚未滿員','貝拉與阿龍固定同行，請再邀請 '+(2-team.length)+' 位 NPC 才能出發。');break;}modal('停車場・劇組車','四人同行：貝拉、阿龍、'+team.map(i=>npcs[i].name).join('、')+'。是否出發前往測試拍攝現場？',[['出發',()=>{if(team.length!==2)return;clearAmbient();scene=1;players[0].x=450;players[0].y=350;players[1].x=490;players[1].y=350;team.forEach((id,i)=>{npcs[id].x=450+i*40;npcs[id].y=390});dlg.close()}]]);break;case 'bike':modal('摩托車','載具位置已保留，騎乘機制待設定。');break;default:modal(s.name,'此區域功能尚未開放。')}}function spawn(){clearAmbient();npcs.forEach((n,i)=>{Object.assign(n,npcHomes[i]);npcWait(n,true)});Object.assign(players[0],{x:390,y:390});Object.assign(players[1],{x:420,y:390});target=null;keys.clear();running=false;energy=[100,100];team.forEach(id=>npcWait(npcs[id],true))}function sw(){active=1-active;target=null;keys.clear()}document.querySelector('#switch').onclick=sw;document.querySelector('#interact').onclick=interact;document.querySelector('#close').onclick=closeConversation;function resetGame(){scene=0;spawn()}document.querySelector('#reset').onclick=resetGame;window.addEventListener('keydown',e=>{if(dlg.open||e.metaKey||e.ctrlKey||e.altKey)return;if(performance.now()-dialogClosedAt<350&&(e.key===' '||e.key.toLowerCase()==='e')){e.preventDefault();return;}const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab',' ','r','e','w','a','s','d','Shift'].includes(k))e.preventDefault();if(e.repeat&&['e','Tab',' ','r'].includes(k))return;if(k==='Tab')sw();else if(k==='e'||k===' ')interact();else if(k==='r')resetGame();else if(k!=='Shift')keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.k)});c.onpointerdown=e=>{let r=c.getBoundingClientRect();target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};const run=document.querySelector('#run');run.onpointerdown=e=>{e.preventDefault();run.setPointerCapture(e.pointerId);running=true};run.onpointerup=run.onpointercancel=run.onlostpointercapture=()=>running=false;window.addEventListener('keydown',e=>{if(e.key==='Shift'&&!dlg.open&&!e.metaKey&&!e.ctrlKey&&!e.altKey)running=true});window.addEventListener('keyup',e=>{if(e.key==='Shift')running=false});window.addEventListener('blur',()=>running=false);requestAnimationFrame(loop);
