function blocked(x,y){return x<12||x>950||y<16||y>665||(!scene&&walls.some(([a,b,w,h])=>x>a-7&&x<a+w+7&&y>b-7&&y<b+h+7))}function move(p,dx,dy){p.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'front':'back');if(!blocked(p.x+dx,p.y))p.x+=dx;if(!blocked(p.x,p.y+dy))p.y+=dy}function loop(t){let dt=Math.min((t-last)/1000,.04)||0;last=t;if(!dlg.open){let dx=0,dy=0,p=players[active];if(keys.has('ArrowLeft')||keys.has('a'))dx--;if(keys.has('ArrowRight')||keys.has('d'))dx++;if(keys.has('ArrowUp')||keys.has('w'))dy--;if(keys.has('ArrowDown')||keys.has('s'))dy++;if(dx||dy)target=null;if(target){let d=Math.hypot(target.x-p.x,target.y-p.y);if(d<5)target=null;else{dx=(target.x-p.x)/d;dy=(target.y-p.y)/d}}if(dx||dy){let d=Math.hypot(dx,dy),speed=energy[active]>0?(running?220:145):70;move(p,dx/d*speed*dt,dy/d*speed*dt);energy[active]=Math.max(0,energy[active]-dt*.65)}}draw();requestAnimationFrame(loop)}function modal(title,body,buttons=[]){keys.clear();target=null;content.replaceChildren();let h=document.createElement('h2');h.textContent=title;let p=document.createElement('p');p.textContent=body;content.append(h,p);buttons.forEach(([s,f])=>{let b=document.createElement('button');b.textContent=s;b.onclick=f;content.append(b)});if(!dlg.open)dlg.showModal()}function shop(){modal('零食商店','餘額 $'+money+'。購買零食後可隨時補充體力。',[['買餅乾 $20',()=>{if(money>=20){money-=20;food++;shop()}else modal('零食商店','金額不足。')}],['吃零食',()=>{if(food){food--;energy[active]=Math.min(100,energy[active]+30)}shop()}]])}function interact(){if(scene){modal('返回基地','結束測試並回到重生區？',[['返回',()=>{scene=0;spawn();dlg.close()}]]);return}let s=near();if(!s){modal('背包','目前持有零食 '+food+' 份。',[['吃零食',()=>{if(food){food--;energy[active]=Math.min(100,energy[active]+30)}dlg.close()}]]);return}switch(s.type){case 'shop':shop();break;case 'rest':energy=[100,100];modal('休息點','貝拉與阿龍的體力已恢復。');break;case 'npc':modal(s.name,team.includes(s.id)?'已加入你的隊伍。':'要邀請我一起去拍攝現場嗎？',[ [team.includes(s.id)?'取消同行':'邀請同行',()=>{if(team.includes(s.id))team=team.filter(i=>i!==s.id);else if(team.length<2)team.push(s.id);else{modal('隊伍已滿','請先取消一位同行 NPC。');return}dlg.close()}]]);break;case 'equipment':modal('劇組器材車','器材車留在中央空地，請到左側停車場出發。');break;case 'props':modal('道具間','道具領取與歸還功能待開發。');break;case 'ward':modal('衣帽間','阿龍服裝測試：日常服目前僅正面素材。',[['工作服＋胸包',()=>{outfit='work';dlg.close()}],['日常服',()=>{outfit='casual';dlg.close()}]]);break;case 'ride':modal('停車場・劇組車','同行：'+(team.map(i=>npcs[i].name).join('、')||'無')+'。是否出發前往測試拍攝現場？',[['出發',()=>{scene=1;players[0].x=450;players[0].y=350;players[1].x=490;players[1].y=350;dlg.close()}]]);break;case 'bike':modal('摩托車','載具位置已保留，騎乘機制待設定。');break;default:modal(s.name,'此區域功能尚未開放。')}}function spawn(){Object.assign(players[0],{x:390,y:390});Object.assign(players[1],{x:420,y:390});target=null;energy=[100,100]}function sw(){active=1-active;target=null;keys.clear()}document.querySelector('#switch').onclick=sw;document.querySelector('#interact').onclick=interact;document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#reset').onclick=()=>{scene=0;spawn()};window.addEventListener('keydown',e=>{if(dlg.open)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab',' '].includes(e.key))e.preventDefault();if(e.repeat&&['e','Tab',' '].includes(e.key))return;if(e.key==='Tab')sw();else if(e.key==='e'||e.key===' ')interact();else keys.add(e.key)});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.k)});c.onpointerdown=e=>{let r=c.getBoundingClientRect();target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};const run=document.querySelector('#run');run.onpointerdown=e=>{e.preventDefault();run.setPointerCapture(e.pointerId);running=true};run.onpointerup=run.onpointercancel=run.onlostpointercapture=()=>running=false;window.addEventListener('keydown',e=>{if(e.key==='Shift')running=true});window.addEventListener('keyup',e=>{if(e.key==='Shift')running=false});window.addEventListener('blur',()=>running=false);requestAnimationFrame(loop);
